version: "3.8"

services:
  logsleuth-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logsleuth-dashboard
    command: ["python", "run.py", "ui", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  logsleuth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logsleuth-api
    command: ["python", "run.py", "api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
